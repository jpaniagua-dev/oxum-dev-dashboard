<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Same locked-down policy as the other two pages: everything a terminal prints comes from disk. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
    />
    <title>Servers</title>
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <!--
      One bar and one grid, and that is the whole page.

      No tab bar, no splitter, no picker: the arrangement is derived from the sessions this window owns,
      so there is nothing here for the user to arrange and nothing to persist. That is the difference
      between this window and the dashboard's pane surface, and the reason it can be this small.
    -->
    <div class="servers-page">
      <header class="servers__bar" id="servers-bar"></header>
      <main class="servers__grid" id="servers-grid"></main>
    </div>
    <script type="module" src="./servers.ts"></script>
  </body>
</html>
