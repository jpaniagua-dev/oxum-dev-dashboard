appId: dev.jpaniagua.oxum-dev-dashboard
productName: Oxum Dev Dashboard
copyright: Copyright (c) 2026 Julio Paniagua

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - '!**/*.map'

# The pty is a native Node-API addon: a `.node` inside the asar cannot be loaded by the OS, so it
# has to stay unpacked.
asarUnpack:
  - '**/*.node'
  - '**/node_modules/@lydell/**'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # Load bearing since 5.13.0, and not a convenience: a Windows toast is only delivered to a process
  # whose AppUserModelID matches a shortcut installed on the Start Menu. Without this shortcut,
  # `new Notification().show()` returns without error and nothing appears, which is why the zip build
  # can never notify and the installer is what the feature actually needs.
  createStartMenuShortcut: true
  shortcutName: Oxum Dev Dashboard
  # A stable name, like the zip's, so `releases/latest/download/...` is a permanent URL rather than one
  # that moves every version. The versioned pattern on `win` is what the portable target needs, and a
  # per-target name is the only way to have both.
  artifactName: oxum-dev-dashboard-win-x64-setup.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    # Measured on this machine: the single-file portable unpacks ~100 MB into `%TEMP%` on *every*
    # launch and takes about 26 s to show a window, against 9,6 s once unpacked. The zip is the
    # install-free option that does not pay that price: unpack it once, run the exe inside.
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

# The portable build needs a name of its own: both targets produce a `.exe`, so leaving them on the
# shared pattern above would have them fight over the same file name.
portable:
  artifactName: ${productName}-${version}-portable.${ext}
  # Same identity as the installed build, so both read the settings in `AppData\Roaming`: the point of
  # the portable build here is not to be isolated, it is not to require an install.
  requestExecutionLevel: user
